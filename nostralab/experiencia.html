<head>
<meta charset="utf-8">

<title>Abriendo laboratorio | NostraLAB</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f9fa;color:#022d33}main{max-width:440px;padding:30px;text-align:center}a{color:#068695;font-weight:800}</style>
</head>
<body><main><p>Abriendo tu laboratorio en pantalla independiente…</p><p><a id="destino" href="./">Ver otros laboratorios</a></p></main>
<script>
(function(){
  'use strict';
  var id=new URLSearchParams(location.search).get('id');
  if(!id||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(id)){location.replace('./');return;}
  var target='./laboratorio.html?id='+encodeURIComponent(id);
  document.getElementById('destino').href=target;
  document.getElementById('destino').textContent='Abrir laboratorio';
  location.replace(target);
})();
</script>
  <script defer src="assets/js/nostra-footer-universal.js?v=2026-91" data-nostra-universal-footer="1"></script>
</body></html>
