name: Remove NostraWEEKEND middle schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-weekend-middle-schedule.yml'

permissions:
  contents: write

jobs:
  patch-weekend-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove repeated schedule block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          block = '\n'.join([
              '                  <div class="row gy-4 justify-content-center">',
              '                    <div class="col-xl-6 col-md-6"><div class="price-card"><div class="price-card_top"><h3 class="price-card_title">Sabatino</h3><h4 class="price-card_price">Sábados <span class="horario-ciclo">(Horario por confirmar)</span></h4></div></div></div>',
              '                    <div class="col-xl-6 col-md-6"><div class="price-card"><div class="price-card_top"><h3 class="price-card_title">Dominical</h3><h4 class="price-card_price">Domingos <span class="horario-ciclo">(Horario por confirmar)</span></h4></div></div></div>',
              '                  </div>'
          ])

          for rel in ['ciclo-weekend-uni.html', 'tools/apply_nostra_weekend.py']:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              count = text.count(block)
              if count != 1:
                  raise SystemExit(f'{rel}: se esperó exactamente 1 bloque intermedio y se encontraron {count}. Se aborta.')
              text = text.replace(block, '', 1)
              path.write_text(text, encoding='utf-8')

          html = Path('ciclo-weekend-uni.html').read_text(encoding='utf-8')
          description_start = html.index('id="Coursedescription"')
          description_end = html.index('id="curriculam"', description_start)
          description = html[description_start:description_end]
          if 'price-card_title">Sabatino' in description or 'price-card_title">Dominical' in description:
              raise SystemExit('La sección Descripción todavía conserva tarjetas de horarios Weekend.')

          pricing_start = html.index('PRECIOS ACADÉMICOS')
          pricing = html[pricing_start:]
          if 'price-card_title">Sabatino' not in pricing or 'price-card_title">Dominical' not in pricing:
              raise SystemExit('La sección inferior de planes perdió Sabatino o Dominical.')

          source = Path('tools/apply_nostra_weekend.py').read_text(encoding='utf-8')
          if block in source:
              raise SystemExit('La fuente generadora todavía contiene el bloque eliminado.')
          PY

          python3 -m py_compile tools/apply_nostra_weekend.py
          git diff --check
          git diff -- ciclo-weekend-uni.html tools/apply_nostra_weekend.py

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/remove-weekend-middle-schedule.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ciclo-weekend-uni.html tools/apply_nostra_weekend.py .github/workflows/remove-weekend-middle-schedule.yml
          git diff --cached --check
          git commit -m "Elimina bloque repetido de horarios NostraWEEKEND"
          git push origin HEAD:main
