name: Corregir programaId del backend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-program-id-once.yml"

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Corregir referencia de programaId
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("functions/backend.js")
          text = path.read_text(encoding="utf-8")
          old = "        programaId,\n        programaNombre:"
          new = "        programaId: programId,\n        programaNombre:"

          if text.count(old) != 1:
              raise SystemExit(f"Se esperaba una coincidencia exacta y se encontraron {text.count(old)}.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verificar sintaxis
        working-directory: functions
        run: node --check backend.js

      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/backend.js
          git commit -m "Corrige referencia programaId en Culqi"
          git push origin HEAD:main
