name: Aplicar eliminación segura y fecha preinscripciones

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/apply-admin-preinscripcion-delete-time.py"
      - ".github/workflows/apply-admin-preinscripcion-delete-time.yml"

permissions:
  contents: write

concurrency:
  group: apply-admin-preinscripcion-delete-time-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar cambios
        run: python tools/apply-admin-preinscripcion-delete-time.py

      - name: Validar JavaScript
        run: node --check assets/js/admin-preinscripciones.js

      - name: Validar elementos clave
        run: |
          grep -q "Eliminar inscripción" admin-preinscripciones.html
          grep -q "formatDateTime(r.createdAt)" assets/js/admin-preinscripciones.js
          grep -q "canDeletePreinscripcion" assets/js/admin-preinscripciones.js
          grep -q "writeBatch" assets/js/admin-preinscripciones.js

      - name: Publicar cambios
        shell: bash
        run: |
          if git diff --quiet -- assets/js/admin-preinscripciones.js admin-preinscripciones.html; then
            echo "Los cambios ya estaban aplicados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin-preinscripciones.js admin-preinscripciones.html
          git commit -m "Agrega eliminación segura y fecha a preinscripciones"
          git push origin HEAD:main
