name: Corregir acción de pago validado

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-validated-payment-action-once.yml"

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ocultar validación manual en pagos confirmados
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/js/admin-preinscripciones.js")
          text = path.read_text(encoding="utf-8")

          marker = """function estadoBadge(value){
  if(value === 'matriculado' || value === 'listo_para_matricula') return badge(value,'green');
  if(value === 'observado' || value === 'rechazado') return badge(value,'red');
  if(value === 'pago_en_revision' || value === 'contactado') return badge(value,'orange');
  return badge(value || 'nuevo','');
}
"""
          addition = marker + """function paymentAction(record){
  const validated = record.pagoValidado === true || record.estadoPago === 'pago_validado';
  if(validated){
    return record.culqiChargeId
      ? badge('Pago confirmado por Culqi','green')
      : badge('Pago validado','green');
  }
  return `<button class=\"mini\" data-pay=\"${esc(record.id)}\">Validar pago</button>`;
}
"""

          if marker not in text:
              raise SystemExit("No se encontró el bloque estadoBadge esperado.")
          text = text.replace(marker, addition, 1)

          old_row = """      <td><button class=\"mini\" data-open=\"${r.id}\">Ver ficha</button><button class=\"mini\" data-pay=\"${r.id}\">Validar pago</button></td>
"""
          new_row = """      <td><button class=\"mini\" data-open=\"${r.id}\">Ver ficha</button>${paymentAction(r)}</td>
"""
          if old_row not in text:
              raise SystemExit("No se encontró la celda de acciones esperada.")
          text = text.replace(old_row, new_row, 1)

          old_modal = """function openModal(id, mode='ficha'){
  const r = records.find(x => x.id === id); if(!r) return;
  currentId = id; currentMode = mode;
"""
          new_modal = """function openModal(id, mode='ficha'){
  const r = records.find(x => x.id === id); if(!r) return;
  if(mode === 'pago' && (r.pagoValidado === true || r.estadoPago === 'pago_validado')) mode = 'ficha';
  currentId = id; currentMode = mode;
"""
          if old_modal not in text:
              raise SystemExit("No se encontró el inicio de openModal esperado.")
          text = text.replace(old_modal, new_modal, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verificar sintaxis
        run: node --check assets/js/admin-preinscripciones.js

      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin-preinscripciones.js
          git commit -m "Oculta validación manual en pagos confirmados"
          git push origin HEAD:main
