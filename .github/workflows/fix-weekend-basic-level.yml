name: Fix NostraWEEKEND basic level

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-weekend-basic-level.yml'

permissions:
  contents: write

jobs:
  patch-weekend-level:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Weekend level only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/js/nostra-ciclo-detalle-pro.js')
          text = path.read_text(encoding='utf-8')
          marker = "'ciclo-weekend-uni.html': {"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('No se encontró el bloque NostraWEEKEND.')
          end = text.find('\n    }', start)
          if end < 0:
              raise SystemExit('No se encontró el cierre del bloque NostraWEEKEND.')
          end += len('\n    }')
          block = text[start:end]
          old = "nivel: 'Intermedio · Avanzado'"
          new = "nivel: 'Básico'"
          if new not in block:
              if old not in block:
                  raise SystemExit('El bloque Weekend no contiene el nivel esperado; se aborta.')
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')
          updated = path.read_text(encoding='utf-8')
          start2 = updated.find(marker)
          end2 = updated.find('\n    }', start2)
          block2 = updated[start2:end2]
          if new not in block2 or old in block2:
              raise SystemExit('La validación final del nivel Básico falló.')
          print('NostraWEEKEND configurado correctamente como nivel Básico.')
          PY
          node --check assets/js/nostra-ciclo-detalle-pro.js
          git diff --check
          git diff -- assets/js/nostra-ciclo-detalle-pro.js

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-weekend-basic-level.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/nostra-ciclo-detalle-pro.js .github/workflows/fix-weekend-basic-level.yml
          git diff --cached --check
          git commit -m "Corrige NostraWEEKEND a nivel Básico"
          git push origin HEAD:main
