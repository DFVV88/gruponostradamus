name: Corregir URL QR NostraASISTENCIA

on:
  push:
    branches:
      - feat/asistencia-ruta-oficial
    paths:
      - ".github/workflows/fix-asistencia-route.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/asistencia-ruta-oficial
          fetch-depth: 0
      - name: Corregir constructor del QR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions/asistencia.js')
          s = p.read_text(encoding='utf-8')
          old = "  const separator = base.includes('?') ? '&' : '?';"
          new = "  const separator = config.publicBaseUrl.includes('?') ? '&' : '?';"
          if old not in s:
              raise SystemExit('No se encontro la referencia antigua base')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check functions/asistencia.js
          if grep -q "base.includes" functions/asistencia.js; then
            echo "Sigue existiendo una referencia base.includes" >&2
            exit 1
          fi
          grep -q 'https://gruponostradamus.edu.pe/asistencia' functions/asistencia.js
      - name: Publicar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/asistencia.js
          git commit -m "Corrige URL del QR de asistencia [skip ci]"
          git push origin HEAD:feat/asistencia-ruta-oficial
