name: Aplicar voucher opcional en pagos manuales

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-voucher-opcional.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar correccion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vouchers = Path('assets/js/admin-vouchers.js')
          text = vouchers.read_text(encoding='utf-8')
          original = text

          old = """function needsVoucher(account){\n  return clean(account) !== 'caja_efectivo';\n}"""
          new = """function needsVoucher(){\n  return false;\n}"""
          if text.count(old) != 1:
              raise SystemExit(f'No se encontro needsVoucher exactamente una vez: {text.count(old)}')
          text = text.replace(old, new)

          old_sync = """function syncRequirement(accountId,inputId,helpId){\n  const account = document.getElementById(accountId);\n  const input = document.getElementById(inputId);\n  const help = document.getElementById(helpId);\n  if(!account || !input || !help) return;\n  const required = needsVoucher(account.value);\n  input.required = required;\n  help.textContent = required\n    ? 'Obligatorio para Yape, Plin, BCP, Culqi y otras transferencias. Formatos JPG, PNG o PDF; máximo 8 MB.'\n    : 'Opcional para pagos en efectivo. Puedes adjuntar una foto del recibo de caja.';\n}"""
          new_sync = """function syncRequirement(accountId,inputId,helpId){\n  const input = document.getElementById(inputId);\n  const help = document.getElementById(helpId);\n  if(!input || !help) return;\n  input.required = false;\n  help.textContent = 'Opcional. Recomendado para Yape, Plin, BCP y otras transferencias. Puedes adjuntarlo ahora o posteriormente. Formatos JPG, PNG o PDF; máximo 8 MB.';\n}"""
          if text.count(old_sync) != 1:
              raise SystemExit(f'No se encontro syncRequirement exactamente una vez: {text.count(old_sync)}')
          text = text.replace(old_sync, new_sync)

          label = '<span>Voucher o constancia de pago</span>'
          count = text.count(label)
          if count != 2:
              raise SystemExit(f'Se esperaban 2 etiquetas de voucher y se encontraron {count}')
          text = text.replace(label, '<span>Voucher o constancia de pago (opcional)</span>')

          if text == original:
              raise SystemExit('No hubo cambios en admin-vouchers.js')
          vouchers.write_text(text, encoding='utf-8')

          loader = Path('assets/js/admin-finanzas-nueva-etapa.js')
          loader_text = loader.read_text(encoding='utf-8')
          old_import = "import('./admin-vouchers.js?v=2026-08-02-1')"
          new_import = "import('./admin-vouchers.js?v=2026-08-18-opcional-1')"
          if loader_text.count(old_import) != 1:
              raise SystemExit(f'No se encontro import versionado de admin-vouchers: {loader_text.count(old_import)}')
          loader.write_text(loader_text.replace(old_import,new_import),encoding='utf-8')
          PY

      - name: Validar JavaScript
        run: |
          node --check assets/js/admin-vouchers.js
          node --check assets/js/admin-finanzas-nueva-etapa.js
          grep -q "Voucher o constancia de pago (opcional)" assets/js/admin-vouchers.js
          grep -q "Puedes adjuntarlo ahora o posteriormente" assets/js/admin-vouchers.js

      - name: Retirar workflow temporal y publicar
        run: |
          rm .github/workflows/temp-voucher-opcional.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin-vouchers.js assets/js/admin-finanzas-nueva-etapa.js .github/workflows/temp-voucher-opcional.yml
          git commit -m "Hace opcional el voucher en pagos manuales"
          git push origin main
