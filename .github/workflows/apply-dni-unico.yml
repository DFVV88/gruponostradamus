name: Aplicar DNI único en preinscripciones

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/apply-dni-unico.py"
      - ".github/workflows/apply-dni-unico.yml"

permissions:
  contents: write

concurrency:
  group: apply-dni-unico-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar protección de DNI
        run: python tools/apply-dni-unico.py

      - name: Ensamblar reglas Firestore
        run: bash scripts/build-firestore-rules.sh

      - name: Validar JavaScript modificado
        run: |
          node --check assets/js/preinscripcion-firebase.js
          node --check assets/js/preinscripcion-alumno-existente.js
          node --check assets/js/admin-alumnos-manuales-editor.js
          node --check assets/js/admin-dni-unico-sync.js

      - name: Validar regla universal de DNI
        run: |
          grep -q "request.resource.data.tipo == 'preinscripcion_web'" firestore.rules
          grep -q "existsAfter(" firestore.rules

      - name: Publicar cambios
        shell: bash
        run: |
          if git diff --quiet -- assets/js/preinscripcion-firebase.js assets/js/preinscripcion-alumno-existente.js assets/js/admin-alumnos-manuales-editor.js assets/js/admin-dni-unico-sync.js preinscripcion.html admin-preinscripciones.html .nostrachat/firestore-rules-parts/insert-alumnos-manuales.rules firestore.rules; then
            echo "La protección de DNI ya estaba aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/preinscripcion-firebase.js \
                  assets/js/preinscripcion-alumno-existente.js \
                  assets/js/admin-alumnos-manuales-editor.js \
                  assets/js/admin-dni-unico-sync.js \
                  preinscripcion.html \
                  admin-preinscripciones.html \
                  .nostrachat/firestore-rules-parts/insert-alumnos-manuales.rules \
                  firestore.rules
          git commit -m "Bloquea preinscripciones duplicadas por DNI"
          git push origin HEAD:main
