name: NostraLAB - portada exclusiva MAT-001
on:
  push:
    branches: [main]
    paths:
      - "scripts/nostralab/build_mat001_social.py"
      - ".github/workflows/build-mat001-social.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nostralab-mat001-social
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos aprobados
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias de imagen
        run: python -m pip install --disable-pip-version-check --no-cache-dir pillow cairosvg
      - name: Generar portada científica y logo oficial
        run: python scripts/nostralab/build_mat001_social.py
      - name: Incorporar JPG oficial a la web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/social/circunferencia-trigonometrica-v31_og.jpg
          if git diff --cached --quiet; then
            echo "La portada ya coincide con la versión generada."
            exit 0
          fi
          git commit -m "assets(nostralab): portada exclusiva MAT-001 [skip ci]"
          git push origin HEAD:main
