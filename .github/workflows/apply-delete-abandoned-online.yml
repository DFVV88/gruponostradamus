name: Aplicar eliminación de pagos online abandonados

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/allow-delete-abandoned-online.py'
      - '.github/workflows/apply-delete-abandoned-online.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cambio
        run: python3 tools/allow-delete-abandoned-online.py

      - name: Validar JavaScript
        run: node --check assets/js/admin-preinscripciones.js

      - name: Validar cambio esperado
        run: |
          grep -q "onlineAttemptExpired" assets/js/admin-preinscripciones.js
          grep -q "30 \* 60 \* 1000" assets/js/admin-preinscripciones.js
          grep -q "delete-not-allowed" assets/js/admin-preinscripciones.js
          grep -q "2026-08-30-delete-online-2" admin-preinscripciones.html

      - name: Commit y push
        run: |
          if git diff --quiet -- assets/js/admin-preinscripciones.js admin-preinscripciones.html; then
            echo "No hay cambios por aplicar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/admin-preinscripciones.js admin-preinscripciones.html
          git commit -m "Permite eliminar pagos online abandonados"
          git push
