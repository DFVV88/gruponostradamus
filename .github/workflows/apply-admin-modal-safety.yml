name: Apply admin modal safety
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-admin-modal-safety.yml'

permissions:
  contents: write

jobs:
  patch-admin-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Load modal safety globally
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin-preinscripciones.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script defer src="assets/js/admin-modal-safety.js?v=2026-08-18-1"></script>'
          anchor = '  <script type="module" src="assets/js/admin-preinscripciones.js?v=2026-02"></script>'

          if tag not in text:
              if anchor not in text:
                  raise SystemExit('No se encontró el punto de carga esperado del panel administrativo.')
              text = text.replace(anchor, '  ' + tag + '\n' + anchor, 1)

          if text.count('admin-modal-safety.js') != 1:
              raise SystemExit('La protección de modales debe cargarse exactamente una vez.')

          path.write_text(text, encoding='utf-8')
          PY

          node --check assets/js/admin-modal-safety.js
          grep -n "admin-modal-safety.js" admin-preinscripciones.html

      - name: Commit correction and remove temporary workflow
        run: |
          rm .github/workflows/apply-admin-modal-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-preinscripciones.html assets/js/admin-modal-safety.js .github/workflows/apply-admin-modal-safety.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Evita cierre accidental de modales administrativos"
          git push origin main
