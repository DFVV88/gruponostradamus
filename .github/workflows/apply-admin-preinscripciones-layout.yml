name: Aplicar mejora visual de preinscripciones

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/improve-admin-preinscripciones-layout.py'
      - '.github/workflows/apply-admin-preinscripciones-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar rediseño
        run: python3 tools/improve-admin-preinscripciones-layout.py

      - name: Validar JavaScript
        run: |
          node --check assets/js/admin-preinscripciones.js
          node --check assets/js/admin-plan-display.js

      - name: Validar estructura esperada
        run: |
          grep -q 'class="preinscripciones-table"' admin-preinscripciones.html
          grep -q 'Ciclo / plan' admin-preinscripciones.html
          grep -q '2026-08-30-layout-1' admin-preinscripciones.html
          grep -q 'class="pre-row"' assets/js/admin-preinscripciones.js
          grep -q "row.querySelector('.col-pago')" assets/js/admin-plan-display.js

      - name: Commit y push
        run: |
          if git diff --quiet -- admin-preinscripciones.html assets/js/admin-preinscripciones.js assets/js/admin-plan-display.js; then
            echo "No hay cambios por aplicar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-preinscripciones.html assets/js/admin-preinscripciones.js assets/js/admin-plan-display.js
          git commit -m "Mejora distribución del panel de preinscripciones"
          git push
