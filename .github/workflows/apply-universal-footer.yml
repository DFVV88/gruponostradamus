name: Aplicar footer universal

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/js/nostra-footer-universal.js"
      - "assets/js/nostra-sitewide-loader.js"
      - "tools/apply_universal_footer.py"
      - ".github/workflows/apply-universal-footer.yml"

permissions:
  contents: write

concurrency:
  group: apply-universal-footer-main
  cancel-in-progress: false

jobs:
  update-html:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Incorporar footer en todas las páginas
        run: python tools/apply_universal_footer.py

      - name: Publicar páginas actualizadas
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Todas las páginas ya contienen el footer universal."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Apply universal footer to all pages [skip ci]"
          git push origin HEAD:main
