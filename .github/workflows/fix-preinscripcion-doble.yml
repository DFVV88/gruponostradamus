name: Corregir doble preinscripcion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/fix-preinscripcion-doble.py"
      - ".github/workflows/fix-preinscripcion-doble.yml"

permissions:
  contents: write

concurrency:
  group: fix-preinscripcion-doble-main
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar bloqueo atomico por DNI
        run: python tools/fix-preinscripcion-doble.py

      - name: Validar JavaScript
        run: |
          node --check assets/js/preinscripcion-culqi-preparacion.js
          node --check assets/js/preinscripcion-firebase.js
          node --check assets/js/preinscripcion-alumno-existente.js

      - name: Verificar que no exista ruta insegura
        run: |
          ! grep -q "flujo compatible" assets/js/preinscripcion-firebase.js
          ! grep -q "addDoc(ctx.fs.collection(ctx.db,'preinscripciones'),data)" assets/js/preinscripcion-firebase.js
          grep -q "ctx.fs.runTransaction" assets/js/preinscripcion-culqi-preparacion.js
          grep -q "alumnos_registro_dni" assets/js/preinscripcion-culqi-preparacion.js
          grep -q "preinscripciones',hash" assets/js/preinscripcion-culqi-preparacion.js
          grep -q "dni-already-exists" assets/js/preinscripcion-culqi-preparacion.js

      - name: Publicar correccion
        shell: bash
        run: |
          if git diff --quiet -- assets/js/preinscripcion-culqi-preparacion.js assets/js/preinscripcion-firebase.js preinscripcion.html; then
            echo "La proteccion contra doble preinscripcion ya estaba aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/preinscripcion-culqi-preparacion.js \
                  assets/js/preinscripcion-firebase.js \
                  preinscripcion.html
          git commit -m "Bloquea doble preinscripcion en flujo Culqi"
          git push origin HEAD:main
