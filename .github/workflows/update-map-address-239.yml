name: Actualizar enlaces de mapa a Gerardo Unger 239

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-map:
    if: contains(github.event.head_commit.message, '[map-239]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reemplazar enlace anterior del mapa
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'https://maps.app.goo.gl/XUF3vLuP6svEMZzj7'
          new = 'https://www.google.com/maps/search/?api=1&query=Av.%20Gerardo%20Unger%20239%2C%20San%20Mart%C3%ADn%20de%20Porres%2C%20Lima'
          excluded = Path('.github/workflows/update-map-address-239.yml')
          allowed = {'.html', '.htm', '.js', '.json', '.md', '.txt', '.xml', '.css', '.yml', '.yaml', '.php'}
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == excluded or path.suffix.lower() not in allowed:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Archivos actualizados: {len(changed)}')
          for path in changed:
              print(path)
          PY

      - name: Verificar y guardar
        shell: bash
        run: |
          if git grep -nF 'https://maps.app.goo.gl/XUF3vLuP6svEMZzj7' -- ':!/.github/workflows/update-map-address-239.yml'; then
            echo 'Todavía queda el enlace anterior del mapa.'
            exit 1
          fi
          git diff --check
          rm -f .github/workflows/update-map-address-239.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Actualiza enlaces de mapa a Av. Gerardo Unger 239'
          git push origin HEAD:main
