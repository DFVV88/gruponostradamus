name: Corregir versión legal del checkout

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-legal-version-once.yml"

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Corregir versión legal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/js/preinscripcion-culqi-preparacion.js")
          text = path.read_text(encoding="utf-8")
          old = "var LEGAL_VERSION = '2026-07-27';"
          new = "var LEGAL_VERSION = '2026-07-25';"

          if old not in text:
              raise SystemExit("No se encontró la versión legal esperada para corregir.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/preinscripcion-culqi-preparacion.js
          git commit -m "Corrige versión legal del checkout Culqi"
          git push origin HEAD:main
