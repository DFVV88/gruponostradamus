name: Validar integración NostraCUENTAS y NostraPORTAL

on:
  pull_request:
    paths:
      - 'assets/js/admin-nostracuentas-portal.mjs'
      - 'assets/js/admin-preinscripciones.js'
      - 'assets/js/admin-nostraportal.js'
      - 'assets/js/nostraportal-link-identity.mjs'
      - 'assets/js/admin-dashboard-pro.js'
      - 'admin-preinscripciones.html'
      - 'admin-nostraportal.html'
      - 'functions/nostraportal.js'
      - 'scripts/test-nostracuentas-portal-vinculacion.mjs'
      - 'scripts/test-nostracuentas-link-diagnostic.mjs'
      - 'scripts/test-nostraportal-autofill-identity.mjs'
      - '.github/workflows/validate-nostracuentas-portal.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/admin-nostracuentas-portal.mjs'
      - 'assets/js/admin-preinscripciones.js'
      - 'functions/nostraportal.js'

permissions:
  contents: read

jobs:
  validacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: |
          node --input-type=module --check < assets/js/admin-preinscripciones.js
          node --input-type=module --check < assets/js/admin-nostraportal.js
          node --check assets/js/admin-nostracuentas-portal.mjs
          node --check assets/js/nostraportal-link-identity.mjs
          node --check assets/js/admin-dashboard-pro.js
          node --check functions/nostraportal.js
      - name: Tests de identidad y separación de acceso
        run: |
          node --test scripts/test-nostracuentas-portal-vinculacion.mjs
          node --test scripts/test-nostracuentas-link-diagnostic.mjs
          node --test scripts/test-nostraportal-autofill-identity.mjs
          node --test functions/test/nostraportal-policy.test.js
          node --test scripts/test-nostraportal-phase2.mjs
