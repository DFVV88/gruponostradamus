name: Corregir registro de preinscripciones

on:
  push:
    branches:
      - main
    paths:
      - "tools/fix-preinscripcion-registro.py"
      - ".github/workflows/fix-preinscripcion-registro.yml"

permissions:
  contents: write

concurrency:
  group: fix-preinscripcion-registro-main
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar corrección de registro
        run: python tools/fix-preinscripcion-registro.py

      - name: Validar JavaScript
        run: |
          node --check assets/js/preinscripcion-culqi-preparacion.js
          node --check assets/js/preinscripcion-firebase.js
          node --check assets/js/preinscripcion-alumno-existente.js
          node --check assets/js/preinscripcion-pago-ux.js

      - name: Verificar que Culqi siga intacto
        run: |
          grep -q "culqiPreparePayment" assets/js/preinscripcion-culqi-preparacion.js
          grep -q "culqiCreateCharge" assets/js/preinscripcion-culqi-preparacion.js
          grep -q "authentication3DS" assets/js/preinscripcion-culqi-preparacion.js
          grep -q "tokenId:tokenId" assets/js/preinscripcion-culqi-preparacion.js
          grep -q "deviceFingerprintId:security.deviceFingerprintId" assets/js/preinscripcion-culqi-preparacion.js

      - name: Verificar que no exista lectura pública prohibida
        run: |
          ! grep -Fq "transaction.get(ref).then(function(preSnapshot)" assets/js/preinscripcion-culqi-preparacion.js
          ! grep -Fq "transaction.get(preRef).then(function(preSnapshot)" assets/js/preinscripcion-firebase.js

      - name: Publicar corrección y limpiar archivos temporales
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm tools/fix-preinscripcion-registro.py .github/workflows/fix-preinscripcion-registro.yml
          git add assets/js/preinscripcion-culqi-preparacion.js \
                  assets/js/preinscripcion-firebase.js \
                  preinscripcion.html

          git commit -m "Corrige bloqueo global de preinscripciones sin alterar Culqi"
          git push origin HEAD:main
