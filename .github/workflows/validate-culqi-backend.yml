name: Validar backend Culqi

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/validate-culqi-backend.yml"

permissions:
  contents: read

concurrency:
  group: validate-culqi-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxis
        working-directory: functions
        run: npm run check
