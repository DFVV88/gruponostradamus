name: Validar integración Culqi y NostraCHAT

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.indexes.json"
      - "storage.rules"
      - "nostrachat-storage-lifecycle.json"
      - ".firebaserc"
      - "preinscripcion.html"
      - "pago-exitoso.html"
      - "pago-pendiente.html"
      - "pago-rechazado.html"
      - "assets/js/preinscripcion-culqi-preparacion.js"
      - "assets/js/preinscripcion-pago-ux.js"
      - "assets/js/pago-culqi-resultado.js"
      - "assets/js/culqi-public-config.js"
      - "assets/js/nostrachat-v1.js"
      - "assets/js/nostrachat-blaze-optimized.js"
      - "assets/js/nostrachat-firebase-config.js"
      - "assets/js/nostrachat-admin.js"
      - "assets/js/nostrachat-admin-users.js"
      - "assets/js/nostrachat-admin-images.js"
      - ".github/workflows/validate-culqi-backend.yml"

permissions:
  contents: read

concurrency:
  group: validate-nostra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias del backend
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Verificar backend y pruebas
        working-directory: functions
        run: npm run check

      - name: Verificar JavaScript público
        run: |
          node --check assets/js/preinscripcion-culqi-preparacion.js
          node --check assets/js/preinscripcion-pago-ux.js
          node --check assets/js/pago-culqi-resultado.js
          node --check assets/js/culqi-public-config.js
          node --check assets/js/nostrachat-v1.js
          node --check assets/js/nostrachat-blaze-optimized.js
          node --check assets/js/nostrachat-firebase-config.js
          node --check assets/js/nostrachat-admin.js
          node --check assets/js/nostrachat-admin-users.js
          node --check assets/js/nostrachat-admin-images.js

      - name: Validar archivos JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('nostrachat-storage-lifecycle.json','utf8'))"

      - name: Impedir llaves privadas en archivos públicos
        run: |
          if grep -R -n -E "sk_(test|live)_" assets/js preinscripcion.html pago-*.html; then
            echo "Se encontró una llave privada de Culqi en archivos públicos."
            exit 1
          fi
