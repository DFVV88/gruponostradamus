name: Validar integración Culqi

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - "preinscripcion.html"
      - "pago-exitoso.html"
      - "pago-pendiente.html"
      - "pago-rechazado.html"
      - "assets/js/preinscripcion-culqi-preparacion.js"
      - "assets/js/preinscripcion-pago-ux.js"
      - "assets/js/pago-culqi-resultado.js"
      - "assets/js/culqi-public-config.js"
      - ".github/workflows/validate-culqi-backend.yml"

permissions:
  contents: read

concurrency:
  group: validate-culqi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias del backend
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Verificar backend y pruebas de precios
        working-directory: functions
        run: npm run check

      - name: Verificar JavaScript del checkout
        run: |
          node --check assets/js/preinscripcion-culqi-preparacion.js
          node --check assets/js/preinscripcion-pago-ux.js
          node --check assets/js/pago-culqi-resultado.js
          node --check assets/js/culqi-public-config.js

      - name: Impedir llaves privadas en archivos públicos
        run: |
          if grep -R -n -E "sk_(test|live)_" assets/js preinscripcion.html pago-*.html; then
            echo "Se encontró una llave privada de Culqi en archivos públicos."
            exit 1
          fi