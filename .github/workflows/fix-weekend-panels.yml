name: Integrate NostraWEEKEND shared cycle panels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-weekend-panels.yml'

permissions:
  contents: write

jobs:
  patch-weekend-panels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch shared cycle modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) Perfil superior + integración general del detalle del ciclo.
          path = 'assets/js/nostra-ciclo-detalle-pro.js'
          text = read(path)
          if "'ciclo-weekend-uni.html': {" not in text:
              marker = "    }\n  };\n\n  var actual = ciclos[file];"
              if text.count(marker) != 1:
                  raise SystemExit('No se encontró cierre único del catálogo de nostra-ciclo-detalle-pro.js')
              weekend = "    },\n    'ciclo-weekend-uni.html': {\n      titulo: 'NostraWEEKEND', corto: 'NostraWEEKEND', icon: '📅', badge: 'Programa complementario UNI',\n      perfil: 'Tu preparación UNI también avanza el fin de semana.',\n      descripcion: 'NostraWEEKEND es un programa complementario de preparación para la UNI pensado para estudiantes que necesitan concentrar su entrenamiento académico durante el fin de semana. Permite elegir una opción Sabatino o Dominical, reforzar conocimientos, practicar con enfoque tipo UNI y sostener un avance constante.',\n      enfoque: 'Entrenamiento concentrado en sábado o domingo, práctica tipo UNI y seguimiento académico.',\n      nivel: 'Intermedio · Avanzado', duracion: 'Preparación de fin de semana', modalidad: 'Sabatino y Dominical',\n      ideal: 'Ideal para estudiantes que necesitan compatibilizar sus actividades semanales con una preparación UNI constante.', url: 'ciclo-weekend-uni.html'\n    }\n  };\n\n  var actual = ciclos[file];"
              text = text.replace(marker, weekend, 1)
          old_list = "'ciclo-paralelo-cepre-uni.html','ciclo-verano-uni.html'"
          new_list = "'ciclo-paralelo-cepre-uni.html','ciclo-verano-uni.html','ciclo-weekend-uni.html'"
          if old_list in text:
              text = text.replace(old_list, new_list, 1)
          elif new_list not in text:
              raise SystemExit('No se encontró la lista de ciclos esperada en nostra-ciclo-detalle-pro.js')
          old_modal = "<span>Modalidad presencial y virtual</span>"
          new_modal = "<span>' + (actual.modalidad || 'Modalidad presencial y virtual') + '</span>"
          if old_modal in text:
              text = text.replace(old_modal, new_modal, 1)
          elif new_modal not in text:
              raise SystemExit('No se encontró el chip de modalidad en nostra-ciclo-detalle-pro.js')
          write(path, text)

          # 2) Panel comercial principal dentro del contenido.
          path = 'assets/js/nostra-content-polish.js'
          text = read(path)
          if "'ciclo-weekend-uni.html': {" not in text:
              marker = "    }\n  };\n\n  function currentFileName()"
              if text.count(marker) != 1:
                  raise SystemExit('No se encontró cierre único de CYCLE_COPY en nostra-content-polish.js')
              weekend = "    },\n    'ciclo-weekend-uni.html': {\n      badge: 'Programa complementario UNI',\n      title: 'NostraWEEKEND',\n      lead: 'Preparación concentrada para quienes quieren seguir avanzando hacia la UNI durante el fin de semana. Elige Sabatino o Dominical y mantén una práctica académica constante sin perder el ritmo.',\n      bullets: ['Sabatino o Dominical', 'Práctica tipo UNI', 'Seguimiento académico', 'Evaluación constante']\n    }\n  };\n\n  function currentFileName()"
              text = text.replace(marker, weekend, 1)
          write(path, text)

          # 3) Panel lateral flotante estable y navegación entre ciclos.
          path = 'assets/js/nostra-cycle-sidebar-premium.js'
          text = read(path)
          if "'ciclo-weekend-uni.html':" not in text:
              marker = "    'ciclo-verano-uni.html': { id:'ciclo-verano-uni', name: 'Ciclo Verano UNI', tag: 'Avanza en vacaciones con base, práctica y método.', icon: '☀️', badge: 'Programa de verano' }\n  };"
              replacement = "    'ciclo-verano-uni.html': { id:'ciclo-verano-uni', name: 'Ciclo Verano UNI', tag: 'Avanza en vacaciones con base, práctica y método.', icon: '☀️', badge: 'Programa de verano' },\n    'ciclo-weekend-uni.html': { id:'nostra-weekend-uni', name: 'NostraWEEKEND', tag: 'Tu preparación UNI también avanza el fin de semana.', icon: '📅', badge: 'Programa complementario UNI' }\n  };"
              if text.count(marker) != 1:
                  raise SystemExit('No se encontró el cierre del mapa de ciclos en nostra-cycle-sidebar-premium.js')
              text = text.replace(marker, replacement, 1)
          write(path, text)

          # 4) Compatibilidad con el módulo histórico de línea/ciclo y enlaces WhatsApp.
          path = 'assets/js/nostra-premium-uni-line.js'
          text = read(path)
          if "'ciclo-weekend-uni.html':{n:'NostraWEEKEND'" not in text:
              marker = "    'ciclo-verano-uni.html':{n:'Ciclo Verano UNI',c:'VERANO',icon:'☀️',verb:'IMPULSA',tag:'Avance intensivo de verano para elevar tu nivel académico.'}\n  });"
              replacement = "    'ciclo-verano-uni.html':{n:'Ciclo Verano UNI',c:'VERANO',icon:'☀️',verb:'IMPULSA',tag:'Avance intensivo de verano para elevar tu nivel académico.'},\n    'ciclo-weekend-uni.html':{n:'NostraWEEKEND',c:'WEEKEND',icon:'📅',verb:'CONTINÚA',tag:'Preparación UNI concentrada en sábado o domingo.'}\n  });"
              if text.count(marker) != 1:
                  raise SystemExit('No se encontró allCycles en nostra-premium-uni-line.js')
              text = text.replace(marker, replacement, 1)
          old_keep = "'Ciclo Verano UNI','NostraMÓDULOS','Proyecto Escolar'"
          new_keep = "'Ciclo Verano UNI','NostraWEEKEND','NostraMÓDULOS','Proyecto Escolar'"
          if old_keep in text:
              text = text.replace(old_keep, new_keep, 1)
          elif new_keep not in text:
              raise SystemExit('No se encontró updateSelects() en nostra-premium-uni-line.js')
          write(path, text)

          # 5) Tipografía específica del horario sincronizado de Weekend.
          path = 'assets/js/nostra-cycle-pricing.js'
          text = read(path)
          css = "      '.price-card_price[data-nostra-weekend-schedule=\"1\"]{font-size:clamp(21px,2vw,28px)!important;line-height:1.18!important;font-weight:850!important;letter-spacing:-.25px!important;white-space:normal!important}',\n"
          if 'data-nostra-weekend-schedule=\\"1\\"' not in text:
              marker = "      '[data-nostra-product-pricing=\"1\"]{scroll-margin-top:110px}'\n"
              if text.count(marker) != 1:
                  raise SystemExit('No se encontró el cierre de estilos de pricing')
              text = text.replace(marker, css + marker, 1)
          write(path, text)

          # 6) Cache bust para servir los módulos nuevos de inmediato.
          path = 'assets/js/nostra-sitewide-loader.js'
          text = read(path)
          old = "  var VERSION = '2026-08-11-weekend-sync';"
          new = "  var VERSION = '2026-08-11-weekend-panels';"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('No se encontró la versión esperada del sitewide loader')
          write(path, text)

          # Validaciones estructurales.
          checks = {
              'assets/js/nostra-ciclo-detalle-pro.js': ["'ciclo-weekend-uni.html': {", "modalidad: 'Sabatino y Dominical'"],
              'assets/js/nostra-content-polish.js': ["title: 'NostraWEEKEND'", "bullets: ['Sabatino o Dominical'"],
              'assets/js/nostra-cycle-sidebar-premium.js': ["id:'nostra-weekend-uni'", "name: 'NostraWEEKEND'"],
              'assets/js/nostra-premium-uni-line.js': ["c:'WEEKEND'", "'NostraWEEKEND'"],
              'assets/js/nostra-cycle-pricing.js': ['data-nostra-weekend-schedule'],
          }
          for filename, needles in checks.items():
              current = read(filename)
              for needle in needles:
                  if needle not in current:
                      raise SystemExit(f'Validación falló en {filename}: {needle}')
          PY

          node --check assets/js/nostra-ciclo-detalle-pro.js
          node --check assets/js/nostra-content-polish.js
          node --check assets/js/nostra-cycle-sidebar-premium.js
          node --check assets/js/nostra-premium-uni-line.js
          node --check assets/js/nostra-cycle-pricing.js
          node --check assets/js/nostra-sitewide-loader.js
          git diff --check
          git diff -- assets/js/nostra-ciclo-detalle-pro.js assets/js/nostra-content-polish.js assets/js/nostra-cycle-sidebar-premium.js assets/js/nostra-premium-uni-line.js assets/js/nostra-cycle-pricing.js assets/js/nostra-sitewide-loader.js

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-weekend-panels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/nostra-ciclo-detalle-pro.js assets/js/nostra-content-polish.js assets/js/nostra-cycle-sidebar-premium.js assets/js/nostra-premium-uni-line.js assets/js/nostra-cycle-pricing.js assets/js/nostra-sitewide-loader.js .github/workflows/fix-weekend-panels.yml
          git diff --cached --check
          git commit -m "Integra paneles visuales de NostraWEEKEND"
          git push origin HEAD:main
