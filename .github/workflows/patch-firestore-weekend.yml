name: Patch Firestore rules for NostraWEEKEND

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-firestore-weekend.yml'

permissions:
  contents: write

jobs:
  patch-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate firestore.rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('firestore.rules')
          text = path.read_text(encoding='utf-8')

          official_pattern = "        'ciclo-verano-uni'\n      ];"
          official_replacement = "        'ciclo-verano-uni',\n        'nostra-weekend-uni'\n      ];"
          if text.count(official_pattern) != 1:
              raise SystemExit('No se encontró exactamente una lista isOfficialProgramId pendiente. Abortando.')
          text = text.replace(official_pattern, official_replacement, 1)

          public_pattern = "          'ciclo-verano-uni'\n        ];"
          public_replacement = "          'ciclo-verano-uni',\n          'nostra-weekend-uni'\n        ];"
          if text.count(public_pattern) != 1:
              raise SystemExit('No se encontró exactamente una lista programas_publicos pendiente. Abortando.')
          text = text.replace(public_pattern, public_replacement, 1)

          marker = "    function validPreInitialState(d) {\n"
          if text.count(marker) != 1:
              raise SystemExit('No se encontró de forma única validPreInitialState(). Abortando.')

          helper_lines = [
              "    function validAcademicLine(d) {",
              "      return (",
              "          d.programaId in [",
              "            'ciclo-ien',",
              "            'proyecto-escolar'",
              "          ]",
              "          && d.lineaAcademica == 'Preparación Escolar'",
              "        )",
              "        || (",
              "          d.programaId in [",
              "            'paralelo-cepre-uni',",
              "            'ciclo-verano-uni',",
              "            'nostra-weekend-uni'",
              "          ]",
              "          && d.lineaAcademica == 'Programas Complementarios UNI'",
              "        )",
              "        || (",
              "          d.programaId in [",
              "            'nostra-360-uni',",
              "            'nostra-power-uni',",
              "            'nostra-elite-uni',",
              "            'nostra-prime-uni',",
              "            'nostra-talentum-uni'",
              "          ]",
              "          && d.lineaAcademica == 'Nostra UNI Premium'",
              "        );",
              "    }",
              "",
              ""
          ]
          helper = "\n".join(helper_lines)
          text = text.replace(marker, helper + marker, 1)

          old_line = "        && d.lineaAcademica == 'Nostra UNI Premium'\n"
          new_line = "        && validAcademicLine(d)\n"
          if text.count(old_line) != 1:
              raise SystemExit('La validación antigua de lineaAcademica no aparece exactamente una vez. Abortando.')
          text = text.replace(old_line, new_line, 1)

          if text.count("'nostra-weekend-uni'") != 3:
              raise SystemExit('NostraWEEKEND debe quedar exactamente en 3 puntos de las reglas.')
          if text.count('function validAcademicLine(d)') != 1:
              raise SystemExit('validAcademicLine() no quedó definida exactamente una vez.')
          if text.count('&& validAcademicLine(d)') != 1:
              raise SystemExit('validPreInitialState no usa validAcademicLine() exactamente una vez.')
          if "d.lineaAcademica == 'Programas Complementarios UNI'" not in text:
              raise SystemExit('Falta la categoría Programas Complementarios UNI.')
          if "d.lineaAcademica == 'Preparación Escolar'" not in text:
              raise SystemExit('Falta la categoría Preparación Escolar.')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- firestore.rules

      - name: Commit rules change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-firestore-weekend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules .github/workflows/patch-firestore-weekend.yml
          git diff --cached --check
          git commit -m "Permite NostraWEEKEND en reglas Firestore"
          git push origin HEAD:main
