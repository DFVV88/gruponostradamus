name: Patch Firestore rules for NostraWEEKEND

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-firestore-weekend.yml'

permissions:
  contents: write

jobs:
  patch-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate firestore.rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('firestore.rules')
          text = path.read_text(encoding='utf-8')

          # 1) NostraWEEKEND debe estar permitido tanto en isOfficialProgramId()
          #    como en /programas_publicos/{programId}.
          list_pattern = "        'ciclo-verano-uni'\n      ];"
          list_replacement = "        'ciclo-verano-uni',\n        'nostra-weekend-uni'\n      ];"
          count = text.count(list_pattern)
          if count != 2:
              raise SystemExit(f'Esperaba 2 listas oficiales sin NostraWEEKEND y encontré {count}. Abortando.')
          text = text.replace(list_pattern, list_replacement)

          # 2) Validar que lineaAcademica corresponda realmente al tipo de programa.
          marker = "    function validPreInitialState(d) {\n"
          if text.count(marker) != 1:
              raise SystemExit('No se encontró de forma única validPreInitialState(). Abortando.')

          helper = """    function validAcademicLine(d) {
      return (
          d.programaId in [
            'ciclo-ien',
            'proyecto-escolar'
          ]
          && d.lineaAcademica == 'Preparación Escolar'
        )
        || (
          d.programaId in [
            'paralelo-cepre-uni',
            'ciclo-verano-uni',
            'nostra-weekend-uni'
          ]
          && d.lineaAcademica == 'Programas Complementarios UNI'
        )
        || (
          d.programaId in [
            'nostra-360-uni',
            'nostra-power-uni',
            'nostra-elite-uni',
            'nostra-prime-uni',
            'nostra-talentum-uni'
          ]
          && d.lineaAcademica == 'Nostra UNI Premium'
        );
    }

"""
          text = text.replace(marker, helper + marker, 1)

          old_line = "        && d.lineaAcademica == 'Nostra UNI Premium'\n"
          new_line = "        && validAcademicLine(d)\n"
          if text.count(old_line) != 1:
              raise SystemExit('La validación antigua de lineaAcademica no aparece exactamente una vez. Abortando.')
          text = text.replace(old_line, new_line, 1)

          # Invariantes mínimas del parche.
          if text.count("'nostra-weekend-uni'") < 3:
              raise SystemExit('NostraWEEKEND no quedó presente en todas las reglas requeridas.')
          if "&& validAcademicLine(d)" not in text:
              raise SystemExit('validPreInitialState no usa validAcademicLine().')
          if "d.lineaAcademica == 'Programas Complementarios UNI'" not in text:
              raise SystemExit('Falta la categoría Programas Complementarios UNI.')
          if "d.lineaAcademica == 'Preparación Escolar'" not in text:
              raise SystemExit('Falta la categoría Preparación Escolar.')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- firestore.rules

      - name: Commit rules change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-firestore-weekend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules .github/workflows/patch-firestore-weekend.yml
          git diff --cached --check
          git commit -m "Permite NostraWEEKEND en reglas Firestore"
          git push origin HEAD:main
