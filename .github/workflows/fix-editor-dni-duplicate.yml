name: Fix duplicate DNI editor load

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-editor-dni-duplicate.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate editor import and bust cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          layout = Path('assets/js/admin-alumnos-manuales-layout.js')
          text = layout.read_text(encoding='utf-8')
          old = "import './admin-alumnos-manuales-editor.js?v=2026-08-11-1';\n\n"
          if old not in text:
              raise SystemExit('No se encontró la importación duplicada esperada en el layout.')
          text = text.replace(old, '', 1)
          layout.write_text(text, encoding='utf-8')

          html = Path('admin-preinscripciones.html')
          page = html.read_text(encoding='utf-8')
          old_src = 'assets/js/admin-alumnos-manuales-layout.js?v=2026-08-11-1'
          new_src = 'assets/js/admin-alumnos-manuales-layout.js?v=2026-08-18-2'
          if old_src not in page:
              raise SystemExit('No se encontró la versión esperada del layout en el panel.')
          page = page.replace(old_src, new_src, 1)
          html.write_text(page, encoding='utf-8')

          if "import './admin-alumnos-manuales-editor.js" in layout.read_text(encoding='utf-8'):
              raise SystemExit('La importación duplicada todavía existe en el layout.')
          page = html.read_text(encoding='utf-8')
          if page.count('assets/js/admin-alumnos-manuales-editor.js?v=2026-08-18-universal-1') != 1:
              raise SystemExit('El editor no quedó cargado exactamente una vez desde el panel.')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-editor-dni-duplicate.yml
          git add assets/js/admin-alumnos-manuales-layout.js admin-preinscripciones.html
          git commit -m "Corrige doble ejecución del editor de DNI"
          git push
