name: Aplicar Culqi etapa 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/js/admin-tarifario-culqi.js"
      - "assets/js/preinscripcion-culqi-preparacion.js"
      - "tools/apply_culqi_stage2.py"
      - ".github/workflows/apply-culqi-stage2.yml"

permissions:
  contents: write

concurrency:
  group: apply-culqi-stage2-main
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrar módulos
        run: python tools/apply_culqi_stage2.py

      - name: Publicar integración
        shell: bash
        run: |
          if git diff --quiet -- admin-preinscripciones.html preinscripcion.html; then
            echo "Las páginas ya están integradas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-preinscripciones.html preinscripcion.html
          git commit -m "Integrate Culqi stage 2 into admin and pre-registration [skip ci]"
          git push origin HEAD:main
