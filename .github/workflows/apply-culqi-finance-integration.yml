name: Integrar Culqi con Finanzas

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/apply-culqi-finance-integration.py"
      - ".github/workflows/apply-culqi-finance-integration.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-culqi-finance-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar integración Culqi Finanzas
        run: python tools/apply-culqi-finance-integration.py

      - name: Validar JavaScript
        run: |
          node --check assets/js/admin-pagos-matriculas.js
          node --check assets/js/admin-plan-display.js
          node --check functions/backend.js
          node --check functions/webhook.js
          node --check functions/lib/culqi-finance.js

      - name: Ejecutar checks y pruebas
        working-directory: functions
        run: npm run check

      - name: Publicar cambios
        shell: bash
        run: |
          if git diff --quiet -- functions/backend.js functions/webhook.js functions/lib/culqi-finance.js functions/test/culqi-finance.test.js functions/package.json assets/js/admin-pagos-matriculas.js assets/js/admin-plan-display.js admin-preinscripciones.html; then
            echo "La integración Culqi → Finanzas ya estaba aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/backend.js \
                  functions/webhook.js \
                  functions/lib/culqi-finance.js \
                  functions/test/culqi-finance.test.js \
                  functions/package.json \
                  assets/js/admin-pagos-matriculas.js \
                  assets/js/admin-plan-display.js \
                  admin-preinscripciones.html
          git commit -m "Integra pagos Culqi automáticamente con Finanzas"
          git push origin HEAD:main

