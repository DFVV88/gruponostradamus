x-wrap:wrap}.result-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:13px 20px;font-weight:950;text-decoration:none}.result-btn.primary{background:linear-gradient(135deg,var(--orange),var(--teal),var(--navy));color:#fff}.result-btn.whatsapp{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff}.note{margin-top:20px;color:#6a7888;font-size:12px;line-height:1.45}@media(max-width:620px){body{padding:14px}.details{grid-template-columns:1fr}.actions{flex-direction:column}.result-btn{width:100%}}
